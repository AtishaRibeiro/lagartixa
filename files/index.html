<!doctype html><link href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦎</text></svg>" rel=icon><link href=../static/main.css rel=stylesheet><body><div class=centered-column id=header><div><a class=right href=/>Home</a><a class=right href=/posts>Posts</a></div><img alt="beautiful site logo" class=center-img id=site-logo src=/static/base-logo-smile.png width=200><div><a class=left href=/videos>Videos</a><a class=left href=/about>About</a></div></div><div class=centered-column><h2 style=text-align:center>Files</h2><div class=dirs><p><a href=files/street-names>street-names/</a></div><script>document.addEventListener('click', function (e) {
    // Check if the clicked element is our copy button
    if (e.target && e.target.classList.contains('copy')) {
      console.log(e)
      e.preventDefault();
      e.stopPropagation(); // Prevents the <details> from toggling

      // Find the closest <details> then find the .highlight div inside it
      const container = e.target.closest('details');
      const codeBlock = container.querySelector('.highlight');

      if (codeBlock) {
        // .innerText pulls clean text, ignoring all of Pygments' spans/line numbers
        const text = codeBlock.textContent;
        console.log(text);

        navigator.clipboard.writeText(text).then(() => {
          const copyStatus = container.querySelector('.copy-status');
          copyStatus.style.visibility = "visible";
          setTimeout(() => copyStatus.style.visibility = "hidden", 1500);
        });
      }
    }
  });</script></div>
